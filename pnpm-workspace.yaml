packages:
  - apps/*

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

update:
  ignoreDeps:
    - typescript

overrides:
  'typescript': '6.0.3'

packageExtensions:
  file-router-collector@0.9.0:
    peerDependenciesMeta:
      "@react-router/dev":
        optional: true

peerDependencyRules:
  allowedVersions:
    "file-router-collector@0.9.0>@react-router/dev": "8.3.1"
