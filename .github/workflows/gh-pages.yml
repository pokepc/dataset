# Workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'data-next/**'
      - 'src/**'
      - 'pages-versions.json'
      - 'package.json'
      - 'pnpm*.yaml'
      - '.gitmodules'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - '.github/workflows/gh-pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run the current default-branch workflow even for releases from older maintenance branches.
  workflow_run:
    workflows: ['Publish npm Packages']
    types: [completed]

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Skipped release events must not cancel a healthy deployment.
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Pages artifact
        run: pnpm build:pages:versions --root-sha="$(git rev-parse HEAD)"

      - name: Test
        run: pnpm test

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist-pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
